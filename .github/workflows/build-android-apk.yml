name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "android/**"
      - "capacitor.config.json"
      - ".github/workflows/build-android-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # بدل ما نستخدم أداة خارجية قديمة بتحاول تنزل حزمة "tools" اللي
      # جوجل شالتها من زمان، بنستخدم أدوات الأندرويد الجاهزة بالفعل على
      # كمبيوتر GitHub نفسه، وبس نوافق على تراخيصها.
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      # علامة "قابل للتنفيذ" بتاعة gradlew أحيانًا بتضيع وقت رفع/تنزيل
      # الملفات (زي zip) — بنعيد ضبطها هنا يدويًا قبل التشغيل، بدل ما نفترض
      # إنها موجودة.
      - name: Make gradlew executable
        working-directory: android
        run: chmod +x gradlew

      # بنشغّل gradlew عن طريق bash صراحةً (مش ./gradlew مباشرة) — بالطريقة
      # دي مش محتاجين نعتمد على علامة "قابل للتنفيذ" أصلاً، حتى لو ضاعت
      # لأي سبب تاني.
      - name: Build debug APK
        working-directory: android
        run: bash gradlew assembleDebug

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Attach APK to a GitHub Release
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v${{ github.run_number }}
          files: android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}