name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "android/**"
      - "capacitor.config.json"
      - ".github/workflows/build-android-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    # لازم صلاحية "write" صريحة عشان الخطوة الأخيرة تقدر تنشئ GitHub Release —
    # الصلاحية الافتراضية للـ token بتاع الـ workflow بتكون قراءة بس.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # بدل ما نستخدم أداة خارجية قديمة بتحاول تنزل حزمة "tools" اللي
      # جوجل شالتها من زمان، بنستخدم أدوات الأندرويد الجاهزة بالفعل على
      # كمبيوتر GitHub نفسه، وبس نوافق على تراخيصها.
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      # علامة "قابل للتنفيذ" بتاعة gradlew أحيانًا بتضيع وقت رفع/تنزيل
      # الملفات (زي zip) — بنعيد ضبطها هنا يدويًا قبل التشغيل، بدل ما نفترض
      # إنها موجودة.
      - name: Make gradlew executable
        working-directory: android
        run: chmod +x gradlew

      # ── فك تشفير ملف التوقيع السري (Base64) وكتابته كملف حقيقي مؤقت على
      # جهاز البناء بس — الملف نفسه ولا كلمات المرور بتاعته مش متخزنين في
      # الكود خالص، جايين من GitHub Secrets وقت التشغيل بس، ومش بيتحفظوا في
      # أي مكان تاني بعد ما الـ workflow يخلص. ────────────────────────────────
      - name: Decode release keystore
        working-directory: android
        run: echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > app/release.keystore.jks

      # بنشغّل gradlew عن طريق bash صراحةً (مش ./gradlew مباشرة) — بالطريقة
      # دي مش محتاجين نعتمد على علامة "قابل للتنفيذ" أصلاً، حتى لو ضاعت
      # لأي سبب تاني.
      #
      # BUGFIX (تقليل تحذير "مصدر غير معروف" الشديد عند التثبيت): بنبني نسخة
      # "Release" موقّعة رسميًا بدل نسخة "Debug" (اللي كانت موقّعة بمفتاح
      # تجريبي عام معروف لكل المطورين). ده مش بيلغي تحذير أندرويد الأساسي
      # عن تثبيت تطبيقات من بره Google Play (ده جزء طبيعي من نظام أندرويد
      # نفسه ومفيش حل مجاني ليه غير النشر الرسمي على Google Play)، لكنه بيقلل
      # كتير من احتمال إن أندرويد/Play Protect "يمنع" التثبيت خالص، ويخليه
      # في الغالب مجرد تحذير عادي بضغطة "تثبيت على أي حال".
      - name: Build release APK
        working-directory: android
        run: bash gradlew assembleRelease
        env:
          RELEASE_STORE_FILE:     release.keystore.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS:      ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD:   ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk

      - name: Attach APK to a GitHub Release
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v${{ github.run_number }}
          files: android/app/build/outputs/apk/release/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
