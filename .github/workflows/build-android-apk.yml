name: Build Android APK

# تشغيل يدوي دايمًا، وتلقائي كمان لو غيّرت أي حاجة جوه android/ أو
# capacitor.config.json (يعني تغيير في "القشرة النيتف" نفسها — مش أي تعديل
# عادي في src/ اللي مش محتاج APK جديد أصلاً زي ما اتشرح).
on:
  workflow_dispatch:
  push:
    paths:
      - "front/android/**"
      - "front/capacitor.config.json"
      - "front/.github/workflows/build-android-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Build debug APK
        working-directory: front/android
        run: ./gradlew assembleDebug

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: front/android/app/build/outputs/apk/debug/app-debug.apk

      # ── رفع الـ APK كـ GitHub Release — بيدّيك رابط تحميل مباشر وثابت
      # تقدر تحطه في VITE_APK_DOWNLOAD_URL وفي بانر التحميل داخل المنصة. ────
      - name: Attach APK to a GitHub Release
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v${{ github.run_number }}
          files: front/android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}